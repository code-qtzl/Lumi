name: lumi

services:
  server:
    build: ./server
    ports:
      - '3000:3000'
    # Model keys — without this the container runs the canned fixture traveler
    env_file:
      - path: ./server/.env
        required: false
    volumes:
      - ./shared:/shared:ro
    container_name: lumi-server

  client:
    build: ./client
    ports:
      - '5173:5173'
    environment:
      - VITE_DEV_SERVER_URL=http://server:3000
    volumes:
      - ./client/src:/app/src
    depends_on:
      - server
    container_name: lumi-client
