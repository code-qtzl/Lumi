# fly.toml app configuration file generated for lumi-purple-shape-9020 on 2026-10-11T10:49:34-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rosy-log-015'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  NODE_ENV = 'production'
  PORT = '3000'
  TRUST_PROXY = '1'

[[mounts]]
  source = 'lumi_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
