# Fly.io config — one machine that sleeps when idle, data on a 1 GB volume.
# First deploy:
#   fly launch --no-deploy --copy-config        # pick a unique app name
#   fly volumes create lumi_data --size 1
#   fly secrets set SESSION_SECRET=$(openssl rand -hex 32) GROQ_API_KEY=... AUTHORING_TOKEN=...
#   fly deploy --build-arg GIT_SHA=$(git rev-parse HEAD)

app = "lumi"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"

[mounts]
  source = "lumi_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Stop when idle, start on the next request — near-$0 at hackathon traffic.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
