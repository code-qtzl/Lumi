name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm run install:all
      - name: Client lint
        run: cd client && npm run lint
      - name: Client build (includes typecheck)
        run: cd client && npm run build
      - name: Server typecheck
        run: cd server && npm run typecheck
      - name: Server tests
        run: cd server && npm test
      - name: Eval harness (anchor validity gate)
        run: cd server && npm run eval
      - name: Validate shared contracts
        run: cd shared/contracts && python validate.py