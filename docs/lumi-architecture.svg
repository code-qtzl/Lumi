<svg width="100%" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, sans-serif">
  <title>Lumi architecture</title>
  <desc>Component diagram: browser Interface components call the server Session runtime over REST; the runtime uses the Role-play service and TTS service, which call external LLM and TTS APIs; the Feedback service scores transcripts via the LLM; offline tools (variation generator, eval harness) feed scenario cards and measure the scorer. Shared stores hold cards, transcripts, reports, and audio.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a7a72"/>
    </marker>
  </defs>
  <g font-size="11" fill="#7a7a72">
    <rect x="16" y="12" width="10" height="10" rx="2" fill="#7c9885"/>
    <text x="31" y="21">Interface</text>
    <rect x="106" y="12" width="10" height="10" rx="2" fill="#8a7fae"/>
    <text x="121" y="21">Simulation</text>
    <rect x="210" y="12" width="10" height="10" rx="2" fill="#c2917a"/>
    <text x="225" y="21">Feedback &amp; Eval</text>
    <text x="680" y="21" text-anchor="end">edges = contracts, not calls into each other's code</text>
  </g>
  <rect x="10" y="38" width="660" height="96" rx="10" fill="none" stroke="#c9c9c0" stroke-dasharray="4 4"/>
  <text x="24" y="58" font-size="11" fill="#7a7a72" font-weight="600">BROWSER</text>
  <g>
    <rect x="40" y="68" width="180" height="48" rx="8" fill="#f4f4ef" stroke="#7c9885" stroke-width="1.5"/>
    <text x="130" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#30302b">Session UI</text>
    <text x="130" y="104" text-anchor="middle" font-size="10.5" fill="#7a7a72">chat · decision gate</text>
    <rect x="250" y="68" width="180" height="48" rx="8" fill="#f4f4ef" stroke="#7c9885" stroke-width="1.5"/>
    <text x="340" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#30302b">Listen-first player</text>
    <text x="340" y="104" text-anchor="middle" font-size="10.5" fill="#7a7a72">audio, text after</text>
    <rect x="460" y="68" width="180" height="48" rx="8" fill="#f4f4ef" stroke="#7c9885" stroke-width="1.5"/>
    <text x="550" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#30302b">Debrief view</text>
    <text x="550" y="104" text-anchor="middle" font-size="10.5" fill="#7a7a72">scores · anchor jump</text>
  </g>
  <rect x="10" y="182" width="660" height="230" rx="10" fill="none" stroke="#c9c9c0" stroke-dasharray="4 4"/>
  <text x="24" y="202" font-size="11" fill="#7a7a72" font-weight="600">SERVER</text>
  <g>
    <rect x="40" y="214" width="180" height="52" rx="8" fill="#f4f4ef" stroke="#8a7fae" stroke-width="1.5"/>
    <text x="130" y="234" text-anchor="middle" font-size="13" font-weight="600" fill="#30302b">Session runtime</text>
    <text x="130" y="250" text-anchor="middle" font-size="10.5" fill="#7a7a72">hidden state · caps</text>
    <rect x="250" y="214" width="180" height="52" rx="8" fill="#f4f4ef" stroke="#8a7fae" stroke-width="1.5"/>
    <text x="340" y="234" text-anchor="middle" font-size="13" font-weight="600" fill="#30302b">Role-play service</text>
    <text x="340" y="250" text-anchor="middle" font-size="10.5" fill="#7a7a72">prompt builder</text>
    <rect x="250" y="286" width="180" height="52" rx="8" fill="#f4f4ef" stroke="#8a7fae" stroke-width="1.5"/>
    <text x="340" y="306" text-anchor="middle" font-size="13" font-weight="600" fill="#30302b">TTS service</text>
    <text x="340" y="322" text-anchor="middle" font-size="10.5" fill="#7a7a72">cache · F8 fallbacks</text>
    <rect x="460" y="214" width="180" height="52" rx="8" fill="#f4f4ef" stroke="#c2917a" stroke-width="1.5"/>
    <text x="550" y="234" text-anchor="middle" font-size="13" font-weight="600" fill="#30302b">Feedback service</text>
    <text x="550" y="250" text-anchor="middle" font-size="10.5" fill="#7a7a72">scorer + validator</text>
    <rect x="40" y="340" width="600" height="52" rx="8" fill="#f4f4ef" stroke="#c9c9c0"/>
    <text x="340" y="360" text-anchor="middle" font-size="13" font-weight="600" fill="#30302b">Stores (local, v1)</text>
    <text x="340" y="376" text-anchor="middle" font-size="10.5" fill="#7a7a72">scenario cards · transcripts · feedback reports · audio cache</text>
  </g>
  <rect x="10" y="460" width="380" height="140" rx="10" fill="none" stroke="#c9c9c0" stroke-dasharray="4 4"/>
  <text x="24" y="480" font-size="11" fill="#7a7a72" font-weight="600">OFFLINE TOOLS</text>
  <g>
    <rect x="40" y="492" width="150" height="52" rx="8" fill="#f4f4ef" stroke="#c2917a" stroke-width="1.5"/>
    <text x="115" y="512" text-anchor="middle" font-size="12.5" font-weight="600" fill="#30302b">Variation generator</text>
    <text x="115" y="528" text-anchor="middle" font-size="10.5" fill="#7a7a72">invariance-checked</text>
    <rect x="216" y="492" width="150" height="52" rx="8" fill="#f4f4ef" stroke="#c2917a" stroke-width="1.5"/>
    <text x="291" y="512" text-anchor="middle" font-size="12.5" font-weight="600" fill="#30302b">Eval harness</text>
    <text x="291" y="528" text-anchor="middle" font-size="10.5" fill="#7a7a72">labeled set → numbers</text>
  </g>
  <rect x="420" y="460" width="250" height="140" rx="10" fill="none" stroke="#c9c9c0" stroke-dasharray="4 4"/>
  <text x="434" y="480" font-size="11" fill="#7a7a72" font-weight="600">EXTERNAL APIs</text>
  <g>
    <rect x="450" y="492" width="190" height="42" rx="8" fill="#f4f4ef" stroke="#c9c9c0" stroke-width="1.5"/>
    <text x="545" y="510" text-anchor="middle" font-size="12.5" font-weight="600" fill="#30302b">LLM API</text>
    <text x="545" y="525" text-anchor="middle" font-size="10.5" fill="#7a7a72">pinned model version</text>
    <rect x="450" y="548" width="190" height="42" rx="8" fill="#f4f4ef" stroke="#c9c9c0" stroke-width="1.5"/>
    <text x="545" y="566" text-anchor="middle" font-size="12.5" font-weight="600" fill="#30302b">TTS API</text>
    <text x="545" y="581" text-anchor="middle" font-size="10.5" fill="#7a7a72">expressive voice</text>
  </g>
  <g stroke="#7a7a72" fill="none" stroke-width="1.3">
    <path d="M130 116 L130 214" marker-end="url(#arr)"/>
    <path d="M220 240 L250 240" marker-end="url(#arr)"/>
    <path d="M180 266 C200 290, 220 305, 250 310" marker-end="url(#arr)"/>
    <path d="M340 286 L340 116" marker-end="url(#arr)"/>
    <path d="M550 214 L550 116" marker-end="url(#arr)"/>
    <path d="M430 250 C520 260, 545 420, 545 492" marker-end="url(#arr)"/>
    <path d="M595 266 C620 330, 590 440, 560 492" marker-end="url(#arr)"/>
    <path d="M430 320 C560 340, 545 480, 545 548" marker-end="url(#arr)"/>
    <path d="M110 266 L110 340" marker-end="url(#arr)"/>
    <path d="M520 266 L500 340" marker-end="url(#arr)"/>
    <path d="M100 492 L100 392" marker-end="url(#arr)"/>
    <path d="M330 492 C400 440, 480 300, 520 268" marker-end="url(#arr)"/>
  </g>
  <g font-size="10" fill="#7a7a72">
    <text x="138" y="170">REST: turns, decision</text>
    <text x="348" y="180">audio_ref</text>
    <text x="558" y="170">feedback report</text>
    <text x="118" y="310" text-anchor="end">transcript</text>
    <text x="108" y="450">variant cards</text>
    <text x="352" y="462">batch: transcripts → reports</text>
    <text x="470" y="415">card + transcript → reply</text>
  </g>
</svg>
